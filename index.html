<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mis pendientes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef2f1; --surface:#ffffff; --ink:#1b2b2a; --muted:#5d6f6d; --line:#d3dedb;
  --accent:#1f6f66; --accent-ink:#ffffff; --done:#cfe4df; --today:#f2b544; --danger:#b3402f;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1a19; --surface:#17262500; --surface:#172625; --ink:#e6f0ee; --muted:#93aaa6; --line:#2a3f3c;
    --accent:#52b3a5; --accent-ink:#0b1514; --done:#24433f; --today:#f2b544; --danger:#ef8a78;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1a19; --surface:#172625; --ink:#e6f0ee; --muted:#93aaa6; --line:#2a3f3c;
  --accent:#52b3a5; --accent-ink:#0b1514; --done:#24433f; --today:#f2b544; --danger:#ef8a78;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
.wrap{max-width:1040px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:clamp(1.9rem,5vw,2.8rem);line-height:1.05;margin:0;font-weight:700;letter-spacing:-.02em}
.sub{color:var(--muted);margin:6px 0 0}
.grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:800px){.grid{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.cal-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.cal-head h2{flex:1;margin:0;font-size:1.25rem;text-transform:capitalize}
button{font:inherit;color:inherit}
.icon-btn,.ghost{background:transparent;border:1px solid var(--line);border-radius:10px;padding:6px 12px;cursor:pointer}
.icon-btn:hover,.ghost:hover{background:var(--done)}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.dow,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{margin-bottom:4px;color:var(--muted);font-size:.8rem;text-align:center}
.day{aspect-ratio:1/1;min-height:44px;border:1px solid var(--line);border-radius:10px;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:5px 6px;text-align:left}
.day:hover{border-color:var(--accent)}
.day.out{opacity:.38}
.day .n{font-weight:500;font-size:.95rem}
.day .c{font-size:.7rem;color:var(--muted);align-self:flex-end}
.day.has{background:var(--done)}
.day.all{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.day.all .c{color:var(--accent-ink)}
.day.today .n{box-shadow:0 2px 0 var(--today)}
.day.today:not(.all) {border-color:var(--today);border-width:2px}
.day.sel{outline:3px solid var(--ink);outline-offset:1px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:5px;border:1px solid var(--line)}
.task-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px}
.task-head h2{margin:0;font-size:1.25rem;text-transform:capitalize}
.count{color:var(--muted);font-size:.9rem;white-space:nowrap}
.bar{height:8px;border-radius:99px;background:var(--done);overflow:hidden;margin:10px 0 14px}
.bar b{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.add{display:flex;gap:8px;margin-bottom:12px}
.add input{flex:1;min-width:0;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.add button{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:10px;padding:10px 4px;border-top:1px solid var(--line)}
li label{flex:1;display:flex;align-items:center;gap:10px;cursor:pointer;min-width:0}
li input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);flex:none}
li span{overflow-wrap:anywhere}
li.done span{text-decoration:line-through;color:var(--muted)}
.del{border:0;background:transparent;color:var(--danger);cursor:pointer;padding:6px 8px;border-radius:8px;font-size:1.1rem;line-height:1}
.del:hover{background:var(--done)}
.empty{color:var(--muted);padding:14px 0 4px}
.foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:12px}
.head-btns{display:flex;gap:8px;flex-wrap:wrap}
.ghost.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:4px 11px;font-size:.84rem;background:transparent;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip i,.tag i{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.tag{font-style:normal;font-size:.72rem;color:var(--muted);display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:99px;padding:1px 8px;flex:none}
.add{flex-wrap:wrap}
.add input{min-width:150px}
.add select{font:inherit;padding:10px 8px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);max-width:130px}
.gate,.reto{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;background:var(--bg)}
.gate p,.reto p{margin:0 0 10px}
.gate .row,.reto .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.racha{font-size:1.7rem;font-weight:700;line-height:1;margin-bottom:6px}
.ghost:disabled{opacity:.5;cursor:not-allowed}
.chip.mini{border-style:dashed;color:var(--muted);opacity:.55;padding:4px 10px;min-width:30px;justify-content:center}
.chip.mini:hover,.chip.mini:focus-visible{opacity:1}
:root:root:root{--bg:#000;--surface:#050805;--ink:#e6ffe9;--muted:#7fae8a;--line:#1d6b32;--accent:#39ff14;--accent-ink:#000;--done:#0b2a10;--today:#f5ff3b;--danger:#ff4d6d;color-scheme:dark}
.panel{border-color:var(--accent);box-shadow:0 0 14px rgba(57,255,20,.22)}
h1{text-shadow:0 0 14px rgba(57,255,20,.45)}
.day:hover{border-color:var(--accent);box-shadow:0 0 8px rgba(57,255,20,.4)}
.day.all{box-shadow:0 0 10px rgba(57,255,20,.5)}
.day.sel{outline-color:var(--accent)}
.chip.on{background:var(--accent);color:#000;border-color:var(--accent)}
.ghost,.icon-btn,.add input,.add select,.chip{border-color:var(--accent)}
.ghost:hover,.icon-btn:hover{background:var(--done)}
.add button{box-shadow:0 0 10px rgba(57,255,20,.45)}
.gate,.reto{border-color:var(--accent)}
.hab{flex-basis:100%;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.9rem;cursor:pointer}
.hab input{flex:none;min-width:0;width:18px;height:18px;padding:0;accent-color:var(--accent)}
.hq{font:inherit;font-size:.72rem;padding:3px 9px;border:1px solid var(--line);border-radius:99px;background:transparent;color:var(--muted);cursor:pointer;flex:none}
.hq:hover{border-color:var(--danger);color:var(--danger)}
.fiesta{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;pointer-events:none;background:rgba(0,0,0,.6);animation:fiestaBg 2s ease forwards}
.fiesta .box{position:relative;text-align:center;padding:22px 30px;margin:0 16px;border:2px solid var(--accent);border-radius:18px;background:var(--surface);box-shadow:0 0 40px rgba(57,255,20,.6);animation:pop 2s ease forwards}
.fiesta h3{margin:0;font-size:clamp(1.8rem,7vw,2.8rem);color:var(--accent);text-shadow:0 0 16px rgba(57,255,20,.8)}
.fiesta .box p{margin:6px 0 0;color:var(--ink)}
.fiesta .p{position:absolute;top:50%;left:50%;width:9px;height:9px;border-radius:2px;animation:burst 1.5s ease-out forwards}
@keyframes fiestaBg{0%{opacity:0}12%{opacity:1}85%{opacity:1}100%{opacity:0}}
@keyframes pop{0%{transform:scale(.6);opacity:0}15%{transform:scale(1.08);opacity:1}25%{transform:scale(1)}85%{opacity:1}100%{opacity:0}}
@keyframes burst{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(360deg);opacity:0}}
.welcome{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:20px}
.welcome[hidden]{display:none}
.wbox{width:100%;max-width:380px;text-align:center;border:2px solid var(--accent);border-radius:18px;padding:28px 22px;background:var(--surface);box-shadow:0 0 30px rgba(57,255,20,.35)}
.wbox h2{margin:0 0 6px;font-size:2rem;color:var(--accent);text-shadow:0 0 14px rgba(57,255,20,.6)}
.wbox p{margin:0 0 16px;color:var(--muted)}
.wbox input{width:100%;font:inherit;font-size:1.1rem;padding:12px;border:1px solid var(--accent);border-radius:10px;background:var(--bg);color:var(--ink);text-align:center;margin-bottom:12px}
.wbox button{width:100%;background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:12px;font:inherit;font-weight:700;cursor:pointer;box-shadow:0 0 10px rgba(57,255,20,.45)}
.fiesta .box h3{overflow-wrap:anywhere}
.add{margin-bottom:20px}
.hab{margin:6px 0 10px;padding:8px 12px;border:1px dashed var(--line);border-radius:10px}
.hab[hidden]{display:none}
.qh{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.7);padding:20px}
.qhbox{width:100%;max-width:380px;border:2px solid var(--accent);border-radius:16px;background:var(--surface);padding:20px;box-shadow:0 0 30px rgba(57,255,20,.35);display:flex;flex-direction:column;gap:8px}
.qhbox h3{margin:0;color:var(--accent);overflow-wrap:anywhere}
.qhbox p{margin:0 0 6px;color:var(--muted)}
.qhbox .ghost{text-align:center;padding:10px 12px}
.fiesta .gato{display:block;max-width:min(240px,60vw);max-height:200px;margin:0 auto 12px;border-radius:12px;border:2px solid var(--accent)}
@media (prefers-reduced-motion:reduce){.bar b{transition:none}}
</style>
</head>
<body>
<div class="welcome" id="bienvenida" hidden>
  <div class="wbox">
    <h2>Bienvenido</h2>
    <p>¿Cuál es tu nombre?</p>
    <input id="nombre" type="text" maxlength="30" placeholder="Escribe tu nombre" aria-label="Tu nombre" autocomplete="given-name">
    <button id="entrar">Entrar</button>
  </div>
</div>
<div class="wrap">
  <header>
    <div>
      <h1 id="saludo">Mis pendientes</h1>
      <p class="sub" id="resumen"></p>
    </div>
    <div class="head-btns"><button class="ghost" id="nombre-btn">Cambiar nombre</button><button class="ghost" id="hoy">Ir a hoy</button></div>
  </header>

  <div class="grid">
    <section class="panel" aria-label="Calendario">
      <div class="reto" id="habbar" hidden></div>
      <div class="cal-head">
        <button class="icon-btn" id="prev" aria-label="Mes anterior">‹</button>
        <h2 id="mes"></h2>
        <button class="icon-btn" id="next" aria-label="Mes siguiente">›</button>
      </div>
      <div class="dow" aria-hidden="true"><span>Lun</span><span>Mar</span><span>Mié</span><span>Jue</span><span>Vie</span><span>Sáb</span><span>Dom</span></div>
      <div class="days" id="dias"></div>
      <div class="legend">
        <span><i style="background:var(--done)"></i>Con pendientes</span>
        <span><i style="background:var(--accent)"></i>Todo cumplido</span>
        <span><i style="border:2px solid var(--today)"></i>Hoy</span>
      </div>
    </section>

    <section class="panel" aria-label="Lista del día">
      <div class="task-head">
        <h2 id="fecha"></h2>
        <span class="count" id="cuenta"></span>
      </div>
      <div class="bar" aria-hidden="true"><b id="progreso"></b></div>
      <div class="reto" id="reto" hidden></div>
      <div class="chips" id="filtros"></div>
      <div class="add">
        <select id="cat" aria-label="Categoría"></select>
        <input id="nueva" type="text" maxlength="120" list="sug" placeholder="Agrega algo para este día" aria-label="Nueva tarea">
        <datalist id="sug"><option value="Ir al gym"><option value="Tomar 2 litros de agua"><option value="Dormir 8 horas"><option value="Caminar 30 minutos"><option value="Leer 10 minutos"><option value="Meditar"><option value="Estudiar 1 hora"><option value="Lavar trastes"><option value="Hacer la cama"></datalist>
        <button id="agregar">Agregar</button>
        <label class="hab" id="habl" hidden><input type="checkbox" id="hab"> Modo hábito: repetir cada día hasta fin de mes</label>
      </div>
      <ul id="lista"></ul>
      <div class="foot">
        <button class="ghost" id="limpiar">Borrar cumplidas</button>
      </div>
    </section>
  </div>
</div>

<script>
(function(){
  var KEY = 'pendientes-calendario-v1';
  var data = {};
  try { var raw = localStorage.getItem(KEY); if (raw) data = JSON.parse(raw) || {}; } catch (e) { data = {}; }
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} }

  var KEY2 = 'pendientes-extra-v1';
  var extra = { adult: false, racha: {}, habitos: [], nombre: '' };
  try { var r2 = localStorage.getItem(KEY2); if (r2) { var p2 = JSON.parse(r2); if (p2) { extra.adult = !!p2.adult; extra.racha = p2.racha || {}; extra.habitos = p2.habitos || []; extra.nombre = typeof p2.nombre === 'string' ? p2.nombre : ''; } } } catch (e) {}
  function saveX(){ try { localStorage.setItem(KEY2, JSON.stringify(extra)); } catch (e) {} }

  var CATS = [
    { id: 'personal', n: 'Personal', c: '#8a63d2' },
    { id: 'gym', n: 'Gym', c: '#e0702f' },
    { id: 'estudio', n: 'Estudio', c: '#2a8cc4' },
    { id: 'casa', n: 'Casa', c: '#a8962a' }
  ];
  var filtro = 'todas';
  function catsOn(){ return CATS; }
  function catOf(t){ return CATS.filter(function(c){ return c.id === (t.c || 'personal'); })[0] || CATS[0]; }
  function vis(t){ return t.c !== 'r18'; }
  function dot(color){ var i = document.createElement('i'); i.style.background = color; return i; }

  function renderFiltros(){
    var on = catsOn();
    if (filtro !== 'todas' && !on.some(function(c){ return c.id === filtro; })) filtro = 'todas';
    var box = $('filtros'); box.textContent = '';
    [{ id: 'todas', n: 'Todas' }].concat(on).forEach(function(c){
      var b = document.createElement('button');
      b.className = 'chip' + (c.id === filtro ? ' on' : '');
      b.setAttribute('aria-pressed', c.id === filtro ? 'true' : 'false');
      if (c.c) b.appendChild(dot(c.c));
      b.appendChild(document.createTextNode(c.n));
      b.addEventListener('click', function(){ filtro = c.id; render(); });
      box.appendChild(b);
    });
    var s2 = $('cat'); var cur = s2.value; s2.textContent = '';
    on.forEach(function(c){ var o = document.createElement('option'); o.value = c.id; o.textContent = c.n; s2.appendChild(o); });
    var want = filtro !== 'todas' ? filtro : cur;
    if (on.some(function(c){ return c.id === want; })) s2.value = want;
  }

  function streak(){
    var d = new Date(); var n = 0;
    if (!extra.racha[iso(d)]) d.setDate(d.getDate() - 1);
    while (extra.racha[iso(d)]) { n++; d.setDate(d.getDate() - 1); }
    return n;
  }

    var box = $('reto');
    box.hidden = !extra.adult;
    
    
    if (!extra.adult) return;
    box.textContent = '';
    var n = streak();
    var big = document.createElement('div'); big.className = 'racha'; big.textContent = n + (n === 1 ? ' día' : ' días');

    b.disabled = sel > todayIso;
    b.addEventListener('click', function(){ if (marked) delete extra.racha[sel]; else extra.racha[sel] = true; saveX(); render(); });
    row.appendChild(b);
    box.appendChild(big); box.appendChild(p); box.appendChild(row);

  try { [GATO].forEach(function(u){ var pre = new Image(); pre.referrerPolicy = 'no-referrer'; pre.src = u; }); } catch (e) {}

  function celebrate(){
    var old = document.querySelector('.fiesta'); if (old) old.remove();
    var f = document.createElement('div'); f.className = 'fiesta'; f.setAttribute('role', 'status');
    var colors = ['#39ff14', '#f5ff3b', '#ffffff', '#00e5ff'];
    for (var i = 0; i < 30; i++){
      var p = document.createElement('span'); p.className = 'p';
      var a = Math.random() * Math.PI * 2, r = 120 + Math.random() * 220;
      p.style.setProperty('--dx', Math.round(Math.cos(a) * r) + 'px');
      p.style.setProperty('--dy', Math.round(Math.sin(a) * r) + 'px');
      p.style.background = colors[i % colors.length];
      p.style.animationDelay = (Math.random() * 0.2) + 's';
      f.appendChild(p);
    }
    var box = document.createElement('div'); box.className = 'box';
    var h = document.createElement('h3'); h.textContent = '¡Felicidades' + (extra.nombre ? ', ' + extra.nombre : '') + '!';
    var q = document.createElement('p'); q.textContent = 'Completaste todo el día.';
    var img = document.createElement('img'); img.className = 'gato'; img.alt = 'Gatito celebrando'; img.referrerPolicy = 'no-referrer'; var intento = 0; img.src = GATO;
    img.addEventListener('error', function(){ if (intento++ === 0) img.src = GATO; else img.remove(); });
    box.appendChild(img); box.appendChild(h); box.appendChild(q); f.appendChild(box);
    document.body.appendChild(f);
    setTimeout(function(){ f.remove(); }, 2000);
  }

  function fillHabit(h, fromIso){
    var d = parse(fromIso); var m = d.getMonth();
    while (d.getMonth() === m){
      var k = iso(d); var arr = (data[k] = data[k] || []);
      if (!arr.some(function(x){ return x.h === h.id; })) arr.push({ id: h.id + k, t: h.t, d: false, c: h.c, h: h.id });
      d.setDate(d.getDate() + 1);
    }
    h.m = fromIso.slice(0, 7);
  }

  var habOff = {};
  function renderHabitos(){
    var box = $('habbar');
    var key = view.y + '-' + String(view.m + 1).padStart(2, '0');
    var cur = todayIso.slice(0, 7);
    var pend = (key >= cur && !habOff[key]) ? extra.habitos.filter(function(h){ return h.m < key; }) : [];
    box.hidden = !pend.length;
    if (!pend.length) return;
    box.textContent = '';
    var p = document.createElement('p');
    p.textContent = 'Modo hábito: ¿repetir ' + pend.map(function(h){ return h.t; }).join(', ') + ' en ' + MESES[view.m] + '?';
    var row = document.createElement('div'); row.className = 'row';
    var si = document.createElement('button'); si.className = 'ghost on'; si.textContent = 'Sí, todo el mes';
    si.addEventListener('click', function(){
      var from = key === cur ? todayIso : key + '-01';
      pend.forEach(function(h){ fillHabit(h, from); });
      save(); saveX(); render();
    });
    var no = document.createElement('button'); no.className = 'ghost'; no.textContent = 'No, quitar hábito';
    no.addEventListener('click', function(){
      var ids = pend.map(function(h){ return h.id; });
      extra.habitos = extra.habitos.filter(function(h){ return ids.indexOf(h.id) < 0; });
      saveX(); render();
    });
    var later = document.createElement('button'); later.className = 'ghost'; later.textContent = 'Ahora no';
    later.addEventListener('click', function(){ habOff[key] = true; renderHabitos(); });
    row.appendChild(si); row.appendChild(no); row.appendChild(later);
    box.appendChild(p); box.appendChild(row);
  }

  function quitar(t, modo){
    if (modo !== 'dia') extra.habitos = extra.habitos.filter(function(h){ return h.id !== t.h; });
    Object.keys(data).forEach(function(k){
      var aplica = modo === 'dia' ? k === sel : (modo === 'sigue' ? k >= sel : true);
      if (!aplica) return;
      data[k] = (data[k] || []).filter(function(x){ return modo === 'dia' ? x.id !== t.id : x.h !== t.h; });
      if (!data[k].length) delete data[k];
    });
    saveX(); save(); render();
  }

  function preguntarQuitar(t){
    var old = document.querySelector('.qh'); if (old) old.remove();
    var ov = document.createElement('div'); ov.className = 'qh';
    ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-label', 'Quitar hábito');
    var box = document.createElement('div'); box.className = 'qhbox';
    var h = document.createElement('h3'); h.textContent = '¿Quitar “' + t.t + '”?';
    var p = document.createElement('p'); p.textContent = 'Es un hábito que se repite varios días. Elige qué quitar:';
    box.appendChild(h); box.appendChild(p);
    function opcion(txt, fn){
      var b = document.createElement('button'); b.className = 'ghost'; b.textContent = txt;
      b.addEventListener('click', function(){ ov.remove(); fn(); });
      box.appendChild(b);
    }
    opcion('Solo este día', function(){ quitar(t, 'dia'); });
    opcion('Este día y los que siguen', function(){ quitar(t, 'sigue'); });
    opcion('Todo el hábito (también días anteriores)', function(){ quitar(t, 'todo'); });
    opcion('Cancelar', function(){});
    ov.appendChild(box);
    ov.addEventListener('click', function(e){ if (e.target === ov) ov.remove(); });
    document.body.appendChild(ov);
  }

  function setNombreUI(){
    var n = extra.nombre;
    $('saludo').textContent = n ? 'Hola, ' + n : 'Mis pendientes';
    $('bienvenida').hidden = !!n;
  }

  function initExtra(){
    function entrar(){
      var v = $('nombre').value.trim();
      if (!v){ $('nombre').focus(); return; }
      extra.nombre = v; saveX(); setNombreUI();
    }
    $('entrar').addEventListener('click', entrar);
    $('nueva').addEventListener('input', function(){ $('habl').hidden = !this.value.trim(); });
    $('nombre').addEventListener('keydown', function(e){ if (e.key === 'Enter') entrar(); });
    $('nombre-btn').addEventListener('click', function(){
      $('nombre').value = extra.nombre; $('bienvenida').hidden = false; $('nombre').focus();
    });
    setNombreUI();
    if (!extra.nombre) $('nombre').focus();
    
  }

  var MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  var DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function parse(s){ var p = s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }

  var now = new Date();
  var todayIso = iso(now);
  var sel = todayIso;
  var view = { y: now.getFullYear(), m: now.getMonth() };

  var $ = function(id){ return document.getElementById(id); };

  function stats(key){
    var t = (data[key] || []).filter(vis);
    var d = t.filter(function(x){ return x.d; }).length;
    return { total: t.length, done: d };
  }

  function renderCal(){
    $('mes').textContent = MESES[view.m] + ' ' + view.y;
    renderHabitos();
    var box = $('dias'); box.textContent = '';
    var first = new Date(view.y, view.m, 1);
    var offset = (first.getDay() + 6) % 7;
    var start = new Date(view.y, view.m, 1 - offset);
    for (var i = 0; i < 42; i++){
      var d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
      if (i >= 35 && d.getMonth() !== view.m) break;
      var k = iso(d), s = stats(k);
      var b = document.createElement('button');
      var cls = 'day';
      if (d.getMonth() !== view.m) cls += ' out';
      if (k === todayIso) cls += ' today';
      if (k === sel) cls += ' sel';
      if (s.total){ cls += (s.done === s.total) ? ' all' : ' has'; }
      b.className = cls;
      b.setAttribute('aria-label', d.getDate() + ' de ' + MESES[d.getMonth()] + (s.total ? ', ' + s.done + ' de ' + s.total + ' cumplidas' : ', sin pendientes'));
      var n = document.createElement('span'); n.className = 'n'; n.textContent = d.getDate();
      var c = document.createElement('span'); c.className = 'c'; c.textContent = s.total ? s.done + '/' + s.total : '';
      b.appendChild(n); b.appendChild(c);
      (function(key, dateObj){
        b.addEventListener('click', function(){
          sel = key;
          if (dateObj.getMonth() !== view.m){ view = { y: dateObj.getFullYear(), m: dateObj.getMonth() }; }
          render();
        });
      })(k, d);
      box.appendChild(b);
    }
  }

  function renderList(){
    var d = parse(sel);
    $('fecha').textContent = (sel === todayIso ? 'Hoy, ' : DIAS[d.getDay()] + ' ') + d.getDate() + ' de ' + MESES[d.getMonth()];
    var tasks = (data[sel] || []).filter(vis).filter(function(t){ return filtro === 'todas' || (t.c || 'personal') === filtro; });
    var s = stats(sel);
    $('cuenta').textContent = s.total ? s.done + ' de ' + s.total + ' cumplidas' : '';
    $('progreso').style.width = s.total ? Math.round(s.done / s.total * 100) + '%' : '0%';
    var ul = $('lista'); ul.textContent = '';
    if (!tasks.length){
      var e = document.createElement('p'); e.className = 'empty'; e.textContent = 'Nada para este día todavía. Escribe arriba lo que quieres cumplir.';
      ul.appendChild(e);
    }
    tasks.forEach(function(t){
      var li = document.createElement('li'); if (t.d) li.className = 'done';
      var lab = document.createElement('label');
      var cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = !!t.d;
      cb.addEventListener('change', function(){
        var b4 = stats(sel); t.d = cb.checked; save(); render();
        var af = stats(sel);
        if (af.total && af.done === af.total && !(b4.total && b4.done === b4.total)) celebrate();
      });
      var sp = document.createElement('span'); sp.textContent = t.t;
      lab.appendChild(cb); lab.appendChild(sp);
      var cc = catOf(t); var tg = document.createElement('em'); tg.className = 'tag';
      tg.appendChild(dot(cc.c)); tg.appendChild(document.createTextNode(cc.n + (t.h ? ' ↻' : ''))); lab.appendChild(tg);
      var del = document.createElement('button'); del.className = 'del'; del.textContent = '✕'; del.setAttribute('aria-label', 'Eliminar: ' + t.t);
      del.addEventListener('click', function(){
        if (t.h){ preguntarQuitar(t); return; }
        data[sel] = (data[sel] || []).filter(function(x){ return x.id !== t.id; });
        if (!data[sel].length) delete data[sel];
        save(); render();
      });
      if (t.h){
        var hq = document.createElement('button'); hq.className = 'hq'; hq.textContent = 'Quitar hábito';
        hq.setAttribute('aria-label', 'Quitar hábito: ' + t.t);
        hq.addEventListener('click', function(){
          extra.habitos = extra.habitos.filter(function(h){ return h.id !== t.h; });
          Object.keys(data).forEach(function(k){
            if (k >= sel){ data[k] = (data[k] || []).filter(function(x){ return x.h !== t.h; }); if (!data[k].length) delete data[k]; }
          });
          saveX(); save(); render();
        });
        li.appendChild(lab); li.appendChild(del);
      } else { li.appendChild(lab); li.appendChild(del); }
      ul.appendChild(li);
    });
    $('limpiar').style.display = s.done ? '' : 'none';
  }

  function renderResumen(){
    var s = stats(todayIso);
    $('resumen').textContent = s.total
      ? 'Hoy llevas ' + s.done + ' de ' + s.total + ' cumplidas.'
      : 'No tienes nada anotado para hoy.';
  }

  function render(){ renderFiltros(); renderCal(); renderList(); renderResumen(); }

  function addTask(){
    var inp = $('nueva'); var v = inp.value.trim();
    if (!v) { inp.focus(); return; }
    var cat = $('cat').value || 'personal';
    if ($('hab').checked){
      var nh = { id: 'h' + Date.now().toString(36), t: v, c: cat, m: sel.slice(0, 7) };
      extra.habitos.push(nh);
      fillHabit(nh, sel);
      saveX(); $('hab').checked = false;
    } else {
      (data[sel] = data[sel] || []).push({ id: Date.now() + Math.random().toString(36).slice(2,6), t: v, d: false, c: cat });
    }
    inp.value = ''; $('habl').hidden = true; save(); render(); inp.focus();
  }

  $('agregar').addEventListener('click', addTask);
  $('nueva').addEventListener('keydown', function(e){ if (e.key === 'Enter') addTask(); });
  $('prev').addEventListener('click', function(){ view.m--; if (view.m < 0){ view.m = 11; view.y--; } renderCal(); });
  $('next').addEventListener('click', function(){ view.m++; if (view.m > 11){ view.m = 0; view.y++; } renderCal(); });
  $('hoy').addEventListener('click', function(){ sel = todayIso; view = { y: now.getFullYear(), m: now.getMonth() }; render(); });
  $('limpiar').addEventListener('click', function(){
    data[sel] = (data[sel] || []).filter(function(x){ return !x.d; });
    if (!data[sel].length) delete data[sel];
    save(); render();
  });

  render();
  initExtra();
  render();
})();
</script>
</body>
</html>
